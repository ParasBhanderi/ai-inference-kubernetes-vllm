apiVersion: v1
kind: Pod
metadata:
  name: hf-auth-check
  namespace: vllm-example
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: check
      image: vllm/vllm-openai-cpu:v0.32.0-arm64@sha256:433cbee5e0b689095484090454b6fcdf0c68fe3eabfbb251a5e39d442917a4a6
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: hf_token
        - name: HF_HOME
          value: /tmp/huggingface
        - name: HF_HUB_DISABLE_PROGRESS_BARS
          value: "1"
      command: [python3, -c]
      args:
        - |
          import os, sys
          from huggingface_hub import HfApi, hf_hub_download
          token = os.environ["HF_TOKEN"]
          plausible = token.startswith("hf_") and not any(c.isspace() for c in token)
          print("Token format:", "PLAUSIBLE" if plausible else "INVALID", flush=True)
          if not plausible:
              sys.exit(2)
          stage = "Token authentication"
          try:
              HfApi().whoami(token=token)
              print("Token authentication: SUCCESS", flush=True)
              stage = "Gemma configuration download"
              hf_hub_download("google/gemma-3-1b-it", "config.json", token=token)
              print("Gemma configuration download: SUCCESS", flush=True)
              print("No model weights downloaded.", flush=True)
          except Exception as error:
              response = getattr(error, "response", None)
              print(stage + ": FAILED", flush=True)
              print("Error type:", type(error).__name__, flush=True)
              print("HTTP status:", getattr(response, "status_code", "unavailable"), flush=True)
              sys.exit(1)
